name: Calculate Total Commits

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-counter
  cancel-in-progress: true

jobs:
  count-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test counter
        run: python -m unittest discover -s tests -v
      
      - name: Calculate commits
        env:
          GITHUB_TOKEN: ${{ secrets.COMMIT_COUNTER_TOKEN }}
        run: |
          python scripts/count_commits.py
      
      - name: Publish results on the stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add ../commit-counter-stats origin/stats
          cp commit_stats.json ../commit-counter-stats/commit_stats.json
          cd ../commit-counter-stats
          git add commit_stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update commit statistics"
            git push origin HEAD:stats
          fi
